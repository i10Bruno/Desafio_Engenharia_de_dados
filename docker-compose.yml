version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: postgres_container
    restart: always
    env_file:
      - ./config/.env
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "${DB_PORT}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata: